services:
  - type: web
    name: assemble-live-agent
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Supply a PostgreSQL connection string from a provider/plan you have checked.
      # This Blueprint intentionally does not provision a Render database.
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: OPENAI_API_KEY
        sync: false
