databases:
  - name: assemble-profile-db
    databaseName: assemble
    user: assemble_app
    plan: 0.1c-256mb
    region: singapore
    diskSizeGB: 1

services:
  - type: web
    name: assemble-live-agent
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: assemble-profile-db
          property: connectionString
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: OPENAI_API_KEY
        sync: false
